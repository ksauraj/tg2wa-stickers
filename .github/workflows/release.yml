name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.1.0-alpha.1)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          GRADLE_VERSION=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "Tag: $TAG"
          echo "versionName in app/build.gradle.kts: $GRADLE_VERSION"
          if [ "$TAG" != "v$GRADLE_VERSION" ]; then
            echo "::error::Tag $TAG does not match versionName $GRADLE_VERSION. Bump app/build.gradle.kts or retag."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Fail if the release already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Release ${{ steps.version.outputs.tag }} already exists. Releases are immutable; publish a new version instead."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Decode signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.TG2WA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "TG2WA_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No TG2WA_KEYSTORE_B64 secret: the release APKs will be debug-signed."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APKs
        env:
          TG2WA_KEYSTORE_PASSWORD: ${{ secrets.TG2WA_KEYSTORE_PASSWORD }}
          TG2WA_KEY_ALIAS: ${{ secrets.TG2WA_KEY_ALIAS }}
          TG2WA_KEY_PASSWORD: ${{ secrets.TG2WA_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect artifacts and checksums
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/
          cd dist
          for f in *.apk; do
            new=$(echo "$f" | sed "s/^app-/tg2wa-stickers-${{ steps.version.outputs.tag }}-/; s/-release-unsigned//; s/-release//")
            [ "$f" = "$new" ] || mv "$f" "$new"
          done
          sha256sum *.apk > SHA256SUMS.txt
          ls -l
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release-apks-${{ steps.version.outputs.tag }}
          path: dist/
          if-no-files-found: error

      - name: Write release notes
        run: |
          {
            echo "Unofficial Android app built on the Telegram API. Not affiliated with Telegram or WhatsApp."
            echo
            echo "## Install"
            echo
            echo "Pick \`arm64-v8a\` for almost any modern phone, or \`universal\` if unsure, then verify the file against \`SHA256SUMS.txt\`."
            if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then
              echo
              echo "Warning: these APKs are debug-signed because no release keystore was configured for this build."
            fi
            echo
            echo "## Account warning"
            echo
            echo "Telegram's own developer documentation states that \"all accounts that log in using unofficial Telegram API clients are automatically put under observation to avoid violations of the Terms of Service\", and that API abuse such as flooding or spamming results in a permanent ban (https://core.telegram.org/api/obtaining_api_id)."
            echo
            echo "Logging in here puts your account in that observed state. Use an established account, sync a large sticker library in sessions rather than all at once, and understand that nobody can guarantee recovery of a banned account. Read the full warning and the compliance notes in the README before installing."
            echo
            echo "## Changes"
            echo
          } > notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/* \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file notes.md \
            --generate-notes \
            $([ "${{ steps.version.outputs.prerelease }}" = "true" ] && echo --prerelease)
